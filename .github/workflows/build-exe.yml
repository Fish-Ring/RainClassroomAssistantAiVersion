name: Build Windows EXE

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install PyInstaller
      run: |
        pip install pyinstaller

    - name: Build executable with PyInstaller
      run: |
        pyinstaller --noconfirm RainClassroomAssistantAi.spec

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: RainClassroomAssistant-Windows-EXE
        path: dist/RainClassroomAssistantAi.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: RainClassroomAssistant-Windows-EXE
        path: ./dist
        
    - name: Get version from file_version_info.txt
      id: get_version
      run: |
        version=$(python -c "
import re
with open('file_version_info.txt', 'r') as f:
    content = f.read()
    match = re.search(r\"u'FileVersion', u'([^']+)'\", content)
    if match:
        print('v' + match.group(1))
    ")
        echo "VERSION=$version" >> $GITHUB_ENV
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: RainClassroomAssistantAi.exe
        tag_name: ${{ env.VERSION }}
        name: Release ${{ env.VERSION }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}