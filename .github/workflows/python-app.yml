---
name: Build Windows EXE

# 添加权限配置以允许创建发布
permissions:
  contents: write    # 允许写入仓库内容（创建发布）
  issues: write      # 允许写入 issues
  pull-requests: write  # 允许写入 PR

'on':
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed `
            --name RainClassroomAssistantAi RainClassroomAssistant.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/RainClassroomAssistantAi.exe

  release:
    needs: build
    runs-on: windows-latest
    # 只在 push 到 main 分支时创建发布，不在 PR 时创建
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: ./dist/

      - name: Get version
        id: version
        run: |
          $version = Get-Date -Format "yyyyMMdd-HHmmss"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Calculate hash
        id: hash
        run: |
          $hash = (Get-FileHash `
            -Path ./dist/RainClassroomAssistantAi.exe `
            -Algorithm SHA256).Hash
          echo "hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Check prerequisites
        run: |
          if (!(Test-Path "./dist/RainClassroomAssistantAi.exe")) {
            Write-Error "Executable not found in ./dist/"
            exit 1
          }
          Write-Output "All prerequisites met"

      - name: Debug GitHub Context
        run: |
          Write-Output "Event name: ${{ github.event_name }}"
          Write-Output "Ref: ${{ github.ref }}"
          Write-Output "Repository: ${{ github.repository }}"
          Write-Output "Actor: ${{ github.actor }}"
          Write-Output "Token available: $([bool]$env:GITHUB_TOKEN)"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            Windows executable for RainClassroomAssistantAi

            SHA256: `${{ steps.hash.outputs.hash }}`

            Built on: ${{ github.event.head_commit.timestamp }}
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          files: ./dist/RainClassroomAssistantAi.exe
