---
name: Build Windows EXE

'on':
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed `
            --name RainClassroomAssistantAi main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/RainClassroomAssistantAi.exe

  release:
    needs: build
    runs-on: windows-latest
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: ./dist/

      - name: Get version
        id: version
        run: |
          $version = Get-Date -Format "yyyyMMdd-HHmmss"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Calculate hash
        id: hash
        run: |
          $hash = (Get-FileHash `
            -Path ./dist/RainClassroomAssistantAi.exe `
            -Algorithm SHA256).Hash
          echo "hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: >-
            Release v${{ steps.version.outputs.version }}
          body: |
            Windows executable for RainClassroomAssistantAi

            SHA256: `${{ steps.hash.outputs.hash }}`

            Built on: ${{ github.event.head_commit.timestamp }}
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: >-
            ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/RainClassroomAssistantAi.exe
          asset_name: RainClassroomAssistantAi.exe
          asset_content_type: application/octet-stream
